<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E4B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Meu Caixa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<style>
/* =========================================================
   MEU CAIXA — aplicativo pessoal de controle financeiro
   Arquivo único, sem dependências externas, 100% offline.
   ========================================================= */
:root{
  --bg:#EEF2F0; --card:#FFFFFF; --ink:#15211F; --mute:#5E6B68; --line:#DCE3E0; --soft:#F4F7F5;
  --brand:#0E4B47; --brand2:#167A72;
  --in:#1E8C5A; --in-soft:#E2F3EA; --out:#C2414B; --out-soft:#F9E4E6;
  --warn:#B7791F; --warn-soft:#FBF0DC; --card-c:#4361B0; --parc:#8E4FB5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1615; --card:#18211F; --ink:#E7EDEB; --mute:#98A6A2; --line:#26322F; --soft:#1F2927;
  --brand:#16655F; --brand2:#2A9A90; --in:#52C68C; --in-soft:#173A29; --out:#F07C84; --out-soft:#3E1D21;
  --warn:#E5AE4F; --warn-soft:#3A2E16; --card-c:#7D97E0; --parc:#C08BE0;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num,.amt,td{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
h1,h2,h3{letter-spacing:-.01em}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:18px 12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;padding:0 8px 16px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);position:relative;flex:none}
.logo i:after{content:"";position:absolute;left:6px;right:6px;top:12px;height:2px;background:#fff;box-shadow:0 -6px 0 #fff,0 6px 0 #fff}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;color:var(--mute);font-weight:600;text-align:left}
.side nav button b{width:20px;text-align:center;font-size:16px}
.side nav button:hover{background:var(--soft);color:var(--ink)}
.side nav button.on{background:var(--brand);color:#fff}
.side .badge,.mnav .badge{background:var(--out);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:auto}
main{padding:18px 22px 110px;max-width:1120px;width:100%}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:22px;margin:0 auto 0 0}
.month{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px}
.month button:hover{background:var(--soft)}
.month span{min-width:128px;text-align:center;font-weight:600;text-transform:capitalize}
.mnav{display:none}
.fab{position:fixed;right:22px;bottom:24px;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 24px rgba(14,75,71,.35);z-index:25}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:14px 14px 120px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:600;color:var(--mute);padding:5px 0;border-radius:10px;position:relative}
  .mnav button b{font-size:18px;line-height:1.1}
  .mnav button.on{color:var(--brand2)}
  .mnav .badge{position:absolute;top:0;right:18%}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:16px}
  .head h1{font-size:20px}
}

/* ---------- componentes ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h3 small{font-weight:500;color:var(--mute);font-size:13px}
.panel h3 .r{margin-left:auto}
.grid{display:grid;gap:12px;margin-top:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}.g6{grid-template-columns:1fr 1fr}}
.first{margin-top:0}
.kpi .k{color:var(--mute);font-size:13px}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--mute)}
.tile{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left}
.tile .e{font-size:20px}
.tile .k{font-size:12.5px;color:var(--mute);font-weight:600}
.tile .v{font-size:18px;font-weight:700}
button.tile:hover{border-color:var(--brand2)}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-warn{color:var(--warn)}.c-mute{color:var(--mute)}.c-card{color:var(--card-c)}
.rows>div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rows>div:last-child{border-bottom:0}
.rows .tot{font-weight:700;border-bottom:0;border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.rows .tot+.tot{border-top:0;margin-top:0;padding-top:4px}
.note{color:var(--mute);font-size:13px;margin:6px 0}
.empty{color:var(--mute);text-align:center;padding:24px 10px}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:600;background:var(--brand);color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.in{background:var(--in)}.btn.out{background:var(--out)}.btn.danger{background:none;color:var(--out);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:58px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand2)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-weight:600;color:var(--mute);font-size:13.5px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* faixa do dia */
.flow{background:var(--brand);color:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.flow>div{padding:2px 12px;border-left:1px solid rgba(255,255,255,.18)}
.flow>div:first-child{border-left:0;padding-left:2px}
.flow .k{font-size:12.5px;opacity:.78}
.flow .v{font-size:20px;font-weight:700}
.flow .main .v{font-size:28px;letter-spacing:-.02em}
@media (max-width:760px){
  .flow{grid-template-columns:1fr 1fr;gap:12px}
  .flow>div,.flow>div:first-child{border-left:0;padding:0}
  .flow .main{grid-column:1/-1;order:-1;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:10px}
}
.quick{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick input{flex:1 1 120px;width:auto}
.quick select{width:auto;flex:0 1 160px}

/* alertas */
.alerts{display:grid;gap:6px;margin-top:12px}
.alert{display:flex;gap:10px;align-items:center;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}
.alert.red{background:var(--out-soft);color:var(--out)}
.alert.amber{background:var(--warn-soft);color:var(--warn)}
.alert.green{background:var(--in-soft);color:var(--in)}
.alert button{margin-left:auto;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;font-size:13px}

/* lista de lançamentos */
.item{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:3px}
.info{min-width:0}
.info b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info b.link{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.info small{color:var(--mute);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.acts{display:flex;gap:2px;align-items:center}
.chip{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--in-soft);color:var(--in)}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.late{background:var(--out-soft);color:var(--out)}
.chip.off{background:var(--soft);color:var(--mute)}
.ic{border:0;background:none;width:30px;height:30px;border-radius:8px;color:var(--mute);font-size:15px}
.ic:hover{background:var(--soft);color:var(--ink)}
@media (max-width:620px){.item{grid-template-columns:10px 1fr auto}.item .acts{grid-column:2/-1;justify-content:flex-end}}
.dayhead{font-size:12.5px;color:var(--mute);font-weight:700;margin:14px 0 0;text-transform:capitalize;display:flex;justify-content:space-between}
.filters{display:grid;grid-template-columns:2fr repeat(6,1fr);gap:8px;margin-bottom:8px}
.filters label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute);font-weight:600;gap:3px}
@media (max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.filters .q{grid-column:1/-1}}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}}
.sumline{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);padding:6px 0 2px}
.sumline b{color:var(--ink)}

/* gráficos */
svg.chart{width:100%;height:auto;display:block}
svg .ax{font-size:10px;fill:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{margin:7px 0}
.hbar .t{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.hbar .b{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:3px}
.hbar .b span{display:block;height:100%;border-radius:6px}
.prog{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog span{display:block;height:100%;background:var(--brand2);border-radius:6px}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;white-space:nowrap}
tr.hot td{background:var(--out-soft)}
tr.warm td{background:var(--warn-soft)}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11.5px;color:var(--mute);text-align:center;font-weight:700;padding:4px 0}
.cal button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:74px;padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:11.5px;overflow:hidden}
.cal button .d{font-weight:700;font-size:13px}
.cal button.today{border-color:var(--brand2);box-shadow:inset 0 0 0 1px var(--brand2)}
.cal button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.cal button.sel .c-in,.cal button.sel .c-out,.cal button.sel .c-warn{color:#fff}
.cal .blank{visibility:hidden}
@media (max-width:620px){.cal button{min-height:58px;font-size:10px;padding:4px}.cal .hide-sm{display:none}}

/* parcelas */
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .st{font-size:12.5px;color:var(--mute)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,18,16,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:621px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;font-size:18px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mute);font-weight:600}
.f .full{grid-column:1/-1}
.f label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.box{grid-column:1/-1;background:var(--soft);border-radius:12px;padding:10px 12px}
.box input,.box select{background:var(--card)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.foot .l{margin-right:auto}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choose button{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:14px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:2px}
.choose button small{font-weight:500;color:var(--mute);font-size:12.5px}
.choose button:hover{border-color:var(--brand2)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i></i>Meu Caixa</div>
    <nav id="sideNav"></nav>
  </aside>
  <main>
    <div class="head"><h1 id="title"></h1><div class="month" id="monthSel">
      <button data-act="prevM" aria-label="Mês anterior">‹</button><span id="mLabel"></span><button data-act="nextM" aria-label="Próximo mês">›</button>
    </div></div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<nav class="mnav" id="mNav"></nav>
<button class="fab" data-act="chooser" aria-label="Novo lançamento">+</button>
<div class="modal" id="modal"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const KEY = 'meucaixa_v2';
const IN_CATS  = ['Salário','Renda extra','Pix','Transferência','Outros'];
const OUT_CATS = ['Casa','Alimentação','Transporte','Saúde','Escola','Lazer','Compras','Assinaturas','Contas','Cartão','Outros'];
const DASH_OUT = ['Contas fixas','Despesas variáveis','Compras','Parcelamentos','Cartão de crédito','Outros gastos'];
const IN_METHODS  = ['Pix','Dinheiro','Transferência','Depósito','Maquininha','Outro'];
const OUT_METHODS = ['Pix','Dinheiro','Débito','Cartão de crédito','Boleto','Transferência','Débito automático','Outro'];
const COLORS = {
  'Salário':'#0E4B47','Renda extra':'#1E8C5A','Pix':'#2E9BB0','Transferência':'#6A7FDB','Outros':'#8B9693',
  'Casa':'#A0522D','Alimentação':'#E0803A','Transporte':'#3A86C8','Saúde':'#D2557A','Escola':'#6A5ACD','Lazer':'#2BA39A',
  'Compras':'#B7791F','Assinaturas':'#8E4FB5','Contas':'#C2414B','Cartão':'#4361B0',
  'Contas fixas':'#C2414B','Despesas variáveis':'#E0803A','Parcelamentos':'#8E4FB5','Cartão de crédito':'#4361B0','Outros gastos':'#8B9693'
};
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3  = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SCREENS = [
  ['home','Início','◐'],['in','Entradas','↓'],['out','Despesas','↑'],['cal','Calendário','▦'],
  ['inst','Parcelamentos','▤'],['cards','Cartões','▭'],['rec','Contas fixas','↻'],['plan','Planejamento','➚'],
  ['goals','Metas','◎'],['rep','Relatórios','▥'],['search','Pesquisa','⌕'],['cfg','Ajustes','⚙']
];
const MONTH_SCREENS = ['home','in','out','cal','cards'];

/* =========================================================
   ARMAZENAMENTO LOCAL (somente neste navegador)
   ========================================================= */
let MEM = null;
function blank(){
  return {v:2, tx:[], rec:[], recDone:{}, groups:{}, cards:[], goals:[], initial:0, demo:false,
    lastBackup:'', settings:{lowBalance:300, alertDays:5, commitPct:70, projectExtra:true, email:'', backupDays:7}};
}
function normalize(d){
  const b = blank(); const o = Object.assign(b, d||{});
  o.settings = Object.assign(blank().settings, (d&&d.settings)||{});
  ['tx','rec','cards','goals'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  if(!o.groups || typeof o.groups!=='object') o.groups={};
  if(!o.recDone || typeof o.recDone!=='object') o.recDone={};
  return o;
}
function load(){
  try{
    const s = localStorage.getItem(KEY); if(s) return normalize(JSON.parse(s));
    const old = localStorage.getItem('meucaixa_v1');           // migração da versão 1
    if(old){ const d=JSON.parse(old); if(!d.demo) return migrateV1(d); }
  }catch(e){}
  return MEM || blank();
}
function migrateV1(d){
  const map={'Contas fixas':'Contas','Despesas variáveis':'Outros','Parcelamentos':'Compras','Cartão de crédito':'Cartão','Outros gastos':'Outros'};
  const o = normalize({tx:d.tx||[], rec:d.rec||[], recDone:d.recDone||{}, initial:d.initial||0});
  o.tx.forEach(t=>{ if(t.type==='out' && map[t.cat]) t.cat=map[t.cat]; if(t.status==='ok') t.paidDate=t.date; });
  o.rec.forEach(r=>{ if(r.type==='out' && map[r.cat]) r.cat=map[r.cat]; });
  return o;
}
function save(){ MEM = DB; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Não foi possível salvar: armazenamento do navegador indisponível'); } }
let DB = load();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const round2 = v => Math.round((+v||0)*100)/100;
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl = v => fmtBRL.format(round2(v));
const brlShort = v => Math.abs(v)>=1000 ? 'R$ '+(v/1000).toFixed(1).replace('.',',')+' mil' : brl(v);
const pct = v => (isFinite(v)? Math.round(v*100) : 0)+'%';
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
const curYM = () => today().slice(0,7);
function daysIn(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
const endOf = ym => ym+'-'+pad(daysIn(ym));
function addM(ym,k){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+k,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function addMDate(date,k,day){ const ym=addM(date.slice(0,7),k); const d=Math.min(day||+date.slice(8,10), daysIn(ym)); return ym+'-'+pad(d); }
function addDays(date,k){ const d=new Date(date+'T12:00:00'); d.setDate(d.getDate()+k); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function diffDays(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
function mLabel(ym){ const [y,m]=ym.split('-').map(Number); return MESES[m-1]+' '+y; }
function mShort(ym){ const [y,m]=ym.split('-').map(Number); return MES3[m-1]+'/'+String(y).slice(2); }
const dBR = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4) : '';
const dShort = d => d.slice(8,10)+'/'+d.slice(5,7);
function dLabel(date){
  const t=today(); if(date===t) return 'hoje'; if(date===addDays(t,-1)) return 'ontem'; if(date===addDays(t,1)) return 'amanhã';
  return new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short',year:date.slice(0,4)===t.slice(0,4)?undefined:'numeric'});
}
function weekStart(date){ const d=new Date(date+'T12:00:00'); return addDays(date,-((d.getDay()+6)%7)); }
function parseMoney(s){
  let v=String(s??'').replace(/\s|R\$/g,'');
  if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  const n=parseFloat(v); return isFinite(n)? round2(n) : NaN;
}
const moneyIn = v => (v===''||v==null) ? '' : String(round2(v)).replace('.',',');

/* valor efetivo: se pago com outro valor, vale o valor pago */
const val = t => (t.status==='ok' && t.paidValue!=null && t.paidValue!=='') ? +t.paidValue : +t.value;
const sumV = arr => round2(arr.reduce((a,t)=>a+val(t),0));
const signV = t => t.type==='in' ? val(t) : -val(t);
const sumS = arr => round2(arr.reduce((a,t)=>a+signV(t),0));
const monthTx = ym => DB.tx.filter(t=>t.date.startsWith(ym));
const rangeTx = (a,b) => DB.tx.filter(t=>t.date>=a && t.date<=b);
const isIn = t => t.type==='in', isOut = t => t.type==='out';
const isOk = t => t.status==='ok', isPend = t => t.status==='pend';
const isLate = t => t.status==='pend' && t.date<today();
const stLabel = t => isIn(t) ? (isOk(t)?'Recebido':(isLate(t)?'Atrasado':'Previsto')) : (isOk(t)?'Pago':(isLate(t)?'Vencida':'Pendente'));

   SALDOS
   ========================================================= */
// saldo atual = saldo inicial + tudo que foi efetivamente recebido − tudo que foi pago
function saldoAtual(){ return round2(DB.initial + sumS(DB.tx.filter(isOk))); }
// saldo ao fim de um dia: no passado, o que de fato aconteceu; no futuro, saldo atual + pendências até aquele dia
function projected(d){
  if(d < today()) return round2(DB.initial + sumS(DB.tx.filter(t=>isOk(t) && (t.paidDate||t.date)<=d)));
  return round2(saldoAtual() + sumS(DB.tx.filter(t=>isPend(t) && t.date<=d)));
}

/* =========================================================
   CONTAS RECORRENTES
   ========================================================= */
function ensureRecurring(ym){
  let changed=false;
  DB.rec.forEach(r=>{
    if(!r.active || r.ended || ym < r.start) return;
    const k=r.id+'|'+ym; if(DB.recDone[k]) return;
    DB.tx.push({id:uid(),type:r.type,date:ym+'-'+pad(Math.min(r.day,daysIn(ym))),desc:r.desc,cat:r.cat,value:r.value,
      method:r.method,account:r.account||'',status:'pend',note:'',recId:r.id});
    DB.recDone[k]=1; changed=true;
  });
  if(changed) save();
}
function ensureAll(){ const c=curYM(); for(let i=0;i<12;i++) ensureRecurring(addM(c,i)); ensureRecurring(VIEW); }
// remove lançamentos pendentes de uma recorrência a partir de um mês (os pagos ficam no histórico)
function removeFuture(r, fromYM){
  const from=fromYM+'-01';
  const keep=new Set(DB.tx.filter(t=>t.recId===r.id && isOk(t) && t.date>=from).map(t=>t.date.slice(0,7)));
  DB.tx=DB.tx.filter(t=>!(t.recId===r.id && isPend(t) && t.date>=from));
  Object.keys(DB.recDone).forEach(k=>{ const [id,ym]=k.split('|'); if(id===r.id && ym>=fromYM && !keep.has(ym)) delete DB.recDone[k]; });
}

// gera todas as parcelas de uma compra de uma vez
function createGroup(o){
  const id=uid(), n=Math.max(1,o.n|0);
  const per = o.per ? round2(o.per) : Math.floor(o.total/n*100)/100;
  const total = o.per && !o.total ? round2(per*n) : round2(o.total);
  const day = +o.first.slice(8,10);
  DB.groups[id]={id,desc:o.desc,total,n,per,first:o.first,cat:o.cat,method:o.method,account:o.account||'',
    cardId:o.cardId||null,purchaseDate:o.purchaseDate||o.first,note:o.note||'',created:today()};
  for(let i=0;i<n;i++){
    const v = i===n-1 ? round2(total-per*(n-1)) : per;
    const date = addMDate(o.first,i,day), paid = i < (o.paid||0);
    DB.tx.push({id:uid(),type:'out',date,desc:o.desc,cat:o.cat,value:v,method:o.method,account:o.account||'',
      cardId:o.cardId||null,status:paid?'ok':'pend',paidDate:paid?date:null,paidValue:paid?v:null,note:'',group:id,inst:(i+1)+'/'+n});
  }
  return id;
}
// em qual fatura (vencimento) cai uma compra feita no cartão
function cardFirstDue(card, purchaseDate){
  const ym=purchaseDate.slice(0,7), day=+purchaseDate.slice(8,10);
  const closeYM = day >= card.closeDay ? addM(ym,1) : ym;
  const dueYM = card.dueDay > card.closeDay ? closeYM : addM(closeYM,1);
  return dueYM+'-'+pad(Math.min(card.dueDay,daysIn(dueYM)));
}
function groupTx(g){ return DB.tx.filter(t=>t.group===g).sort((a,b)=>parseInt(a.inst)-parseInt(b.inst)); }
function groupInfo(g){
  const ts=groupTx(g); const G=DB.groups[g] || {id:g,desc:ts[0]?.desc,total:sumV(ts),n:ts.length,per:ts[0]?.value,cat:ts[0]?.cat,method:ts[0]?.method,cardId:ts[0]?.cardId};
  const paid=ts.filter(isOk), open=ts.filter(isPend);
  return {G, ts, paid, open, paidSum:sumV(paid), rest:sumV(open), next:open[0]};
}

/* =========================================================
   RENDA EXTRA, PLANEJAMENTO E ALERTAS
   ========================================================= */
const isExtra = t => isIn(t) && t.cat==='Renda extra';
function extraStats(ym){
  const T=today(), ws=weekStart(T);
  const okE = DB.tx.filter(t=>isExtra(t) && isOk(t));
  const month = sumV(okE.filter(t=>t.date.startsWith(ym)));
  const elapsed = ym===curYM() ? +T.slice(8) : (ym<curYM() ? daysIn(ym) : 0);
  const insM = sumV(DB.tx.filter(t=>isIn(t)&&isOk(t)&&t.date.startsWith(ym)));
  const prev = sumV(okE.filter(t=>t.date.startsWith(addM(ym,-1))));
  const prevSame = ym===curYM() ? sumV(okE.filter(t=>t.date>=addM(ym,-1)+'-01' && t.date<=addMDate(T,-1))) : prev;
  const days = new Set(okE.filter(t=>t.date.startsWith(ym)).map(t=>t.date)).size;
  return {
    day: sumV(okE.filter(t=>t.date===T)),
    week: sumV(okE.filter(t=>t.date>=ws && t.date<=T)),
    month, total: sumV(okE), days,
    avgDay: elapsed? month/elapsed : 0, avgWeek: elapsed? month/elapsed*7 : 0,
    share: insM? month/insM : 0, prev, prevSame
  };
}
function avgExtra3(){
  const c=curYM(); const vals=[1,2,3].map(i=>sumV(DB.tx.filter(t=>isExtra(t)&&isOk(t)&&t.date.startsWith(addM(c,-i))))).filter(v=>v>0);
  return vals.length? round2(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
}
function planMonths(n){
  const c=curYM(), est=DB.settings.projectExtra? avgExtra3():0; let accEst=0; const out=[];
  for(let i=0;i<n;i++){
    const m=addM(c,i), mt=monthTx(m);
    const ins=sumV(mt.filter(isIn)), e = i>0? est:0; accEst+=e;
    const desp=sumV(mt.filter(t=>isOut(t)&&!t.group)), parc=sumV(mt.filter(t=>isOut(t)&&t.group));
    const renda=ins+e, gastos=desp+parc;
    out.push({m,ins,est:e,desp,parc,res:round2(renda-gastos),comp: renda>0? gastos/renda : (gastos>0?9.99:0),
      saldo: round2(projected(endOf(m))+accEst)});
  }
  return out;
}
function alerts(){
  const A=[], T=today(), S=DB.settings, lim=addDays(T,S.alertDays);
  const pend=DB.tx.filter(t=>isOut(t)&&isPend(t));
  const late=pend.filter(t=>t.date<T);
  if(late.length) A.push(['red',`${late.length} conta(s) atrasada(s), somando ${brl(sumV(late))}`,'late']);
  const soonC=pend.filter(t=>t.date>=T&&t.date<=lim&&!t.group);
  if(soonC.length) A.push(['amber',`${soonC.length} conta(s) vencem nos próximos ${S.alertDays} dias: ${brl(sumV(soonC))}`,'soon']);
  const soonP=pend.filter(t=>t.date>=T&&t.date<=lim&&t.group);
  if(soonP.length) A.push(['amber',`${soonP.length} parcela(s) vencem nos próximos ${S.alertDays} dias: ${brl(sumV(soonP))}`,'soon']);
  const sa=saldoAtual(), sf=projected(endOf(curYM()));
  if(sa<S.lowBalance) A.push(['red',`Saldo baixo: você tem ${brl(sa)} disponível`]);
  else if(sf<S.lowBalance) A.push(['amber',`Saldo previsto para o fim do mês está baixo: ${brl(sf)}`]);
  const mt=monthTx(curYM()), inM=sumV(mt.filter(isIn)), outM=sumV(mt.filter(isOut));
  if(outM>inM && outM>0) A.push(['red',`Despesas do mês (${brl(outM)}) maiores que as entradas (${brl(inM)})`]);
  const prev3=[1,2,3].map(i=>sumV(monthTx(addM(curYM(),-i)).filter(t=>isOut(t)&&!t.group&&!t.recId&&!t.cardId))).filter(v=>v>0);
  const varNow=sumV(mt.filter(t=>isOut(t)&&!t.group&&!t.recId&&!t.cardId&&isOk(t)));
  if(prev3.length){ const avg=prev3.reduce((a,b)=>a+b,0)/prev3.length; if(varNow>avg*1.2) A.push(['amber',`Gastos do dia a dia já estão ${pct(varNow/avg-1)} acima da média dos meses anteriores`]); }
  planMonths(4).slice(1).forEach(p=>{ if(p.comp*100>=S.commitPct) A.push(['red',`${MESES[+p.m.slice(5)-1]}: ${pct(Math.min(p.comp,9.99))} da renda prevista já está comprometida`,'plan']); });
  if(!DB.demo && DB.tx.length){
    const bd=S.backupDays||7;
    if(!DB.lastBackup) A.unshift(['amber','Você ainda não fez nenhum backup. Envie uma cópia para o seu e-mail','backup']);
    else if(diffDays(DB.lastBackup,T)>=bd) A.unshift(['amber',`Último backup há ${diffDays(DB.lastBackup,T)} dias. Envie uma cópia nova para o seu e-mail`,'backup']);
  }
  DB.goals.forEach(g=>{ const p=g.target? g.saved/g.target:0;
    if(p>=1) A.push(['green',`Meta “${g.name}” atingida!`,'goals']);
    else if(p>=.8) A.push(['green',`Meta “${g.name}” está perto: faltam ${brl(g.target-g.saved)}`,'goals']); });
  return A;
}

/* =========================================================
   GRÁFICOS (SVG próprio)
   ========================================================= */
function barsSVG(labels, series, colors, opt={}){
  const W=opt.w||340,H=opt.h||170,L=4,R=4,T=18,B=22, every=opt.every||1;
  const max=Math.max(1,...series.flat()); const n=labels.length, k=series.length, gw=(W-L-R)/n;
  const bw=Math.max(2,Math.min(24,(gw*0.78)/k));
  let o=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(opt.label||'gráfico')}"><text x="${L}" y="11" class="ax">até ${brlShort(max)}</text>`;
  o+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  for(let i=0;i<n;i++){
    const x0=L+i*gw+(gw-bw*k)/2;
    series.forEach((s,j)=>{ const v=s[i]||0, h=(v/max)*(H-B-T);
      if(v>0) o+=`<rect x="${(x0+j*bw).toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${colors[j]}"><title>${esc(labels[i])}: ${brl(v)}</title></rect>`; });
    if(i%every===0) o+=`<text x="${(L+i*gw+gw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" class="ax">${esc(labels[i])}</text>`;
  }
  return o+'</svg>';
}
function lineSVG(vals, labels, mark){
  const W=340,H=170,L=4,R=4,T=18,B=22;
  const mx=Math.max(0,...vals), mn=Math.min(0,...vals), span=(mx-mn)||1, n=vals.length;
  const X=i=>L+(n<=1?0:i*(W-L-R)/(n-1)), Y=v=>T+(mx-v)/span*(H-B-T);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  let o=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="evolução do saldo"><text x="${L}" y="11" class="ax">de ${brlShort(mn)} a ${brlShort(mx)}</text>`;
  o+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
  o+=`<polygon points="${X(0)},${Y(0)} ${pts.join(' ')} ${X(n-1)},${Y(0)}" fill="var(--brand2)" opacity=".13"/>`;
  o+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--brand2)" stroke-width="2.2" stroke-linejoin="round"/>`;
  if(mark>=0&&mark<n) o+=`<circle cx="${X(mark)}" cy="${Y(vals[mark])}" r="4.5" fill="var(--brand2)" stroke="var(--card)" stroke-width="2"><title>Hoje: ${brl(vals[mark])}</title></circle>`;
  labels.forEach((l,i)=>{ if(l) o+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" class="ax">${l}</text>`; });
  return o+'</svg>';
}
function hbars(map, emptyMsg){
  const rows=Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return `<div class="empty">${emptyMsg||'Sem dados no período.'}</div>`;
  const max=rows[0][1], tot=rows.reduce((a,r)=>a+r[1],0);
  return rows.map(([c,v])=>`<div class="hbar"><div class="t"><span>${esc(c)}</span><span class="num">${brl(v)} <span class="c-mute">${pct(v/tot)}</span></span></div><div class="b"><span style="width:${v/max*100}%;background:${COLORS[c]||'var(--brand2)'}"></span></div></div>`).join('');
}
const groupSum = (arr, key) => arr.reduce((m,t)=>{ const k=typeof key==='function'?key(t):t[key]||'—'; m[k]=round2((m[k]||0)+val(t)); return m; },{});

/* =========================================================
   TELAS: ENTRADAS, DESPESAS, PESQUISA
   ========================================================= */
function filtered(sc){
  const F=getF(sc), q=F.q.trim().toLowerCase();
  return DB.tx.filter(t=>(!F.type||t.type===F.type)&&(!F.from||t.date>=F.from)&&(!F.to||t.date<=F.to)&&(!F.cat||t.cat===F.cat)&&
    (!F.method||t.method===F.method)&&(!F.card||t.cardId===F.card)&&
    (!F.status||(F.status==='late'?isLate(t):t.status===F.status))&&
    (!q||[t.desc,t.cat,t.method,t.account,t.note,t.cardId?cardName(t.cardId):''].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function filterBar(sc){
  const F=getF(sc), ty=F.type;
  const cats = ty==='in'?IN_CATS: ty==='out'?OUT_CATS:[...new Set([...IN_CATS,...OUT_CATS])];
  const meths= ty==='in'?IN_METHODS: ty==='out'?OUT_METHODS:[...new Set([...IN_METHODS,...OUT_METHODS])];
  const sel=(k,opts,lab)=>`<label>${lab}<select data-f="${k}" data-sc="${sc}"><option value="">Todos</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${F[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
  return `<div class="filters">
    <label class="q">Pesquisar<input data-f="q" data-sc="${sc}" value="${esc(F.q)}" placeholder="Ex: mercado, aluguel, geladeira"></label>
    <label>De<input type="date" data-f="from" data-sc="${sc}" value="${F.from}"></label>
    <label>Até<input type="date" data-f="to" data-sc="${sc}" value="${F.to}"></label>
    ${sc==='search'?sel('type',[['in','Entradas'],['out','Despesas']],'Tipo'):''}
    ${sel('cat',cats.map(c=>[c,c]),'Categoria')}
    ${sel('method',meths.map(c=>[c,c]),'Forma')}
    ${sel('status',ty==='in'?[['ok','Recebido'],['pend','Previsto'],['late','Atrasado']]:[['ok','Pago'],['pend','Pendente'],['late','Vencido']],'Status')}
    ${sc!=='in'&&DB.cards.length?sel('card',DB.cards.map(c=>[c.id,c.name]),'Cartão'):''}
  </div>
  <div class="bar"><button class="btn sm ghost" data-act="clearF" data-sc="${sc}">Limpar filtros</button>
  <button class="btn sm ghost" data-act="csvF" data-sc="${sc}">Exportar resultado (CSV)</button></div>`;
}
function resultsHTML(sc){
  const list=filtered(sc), ins=list.filter(isIn), outs=list.filter(isOut);
  let body='', last='';
  list.slice(0,400).forEach(t=>{ if(t.date!==last){ const d=list.filter(x=>x.date===t.date); body+=`<div class="dayhead"><span>${dLabel(t.date)}</span><span class="num">${brl(sumS(d))}</span></div>`; last=t.date; } body+=itemHTML(t); });
  if(!list.length) body=`<div class="empty">Nenhum lançamento encontrado. Ajuste os filtros ou toque em + para lançar.</div>`;
  return `<div class="sumline"><span><b>${list.length}</b> lançamentos</span>
    ${ins.length?`<span>Entradas <b class="c-in">${brl(sumV(ins))}</b> (recebido ${brl(sumV(ins.filter(isOk)))})</span>`:''}
    ${outs.length?`<span>Saídas <b class="c-out">${brl(sumV(outs))}</b> (pago ${brl(sumV(outs.filter(isOk)))} • pendente ${brl(sumV(outs.filter(isPend)))})</span>`:''}
  </div>${body}${list.length>400?'<div class="note">Mostrando os 400 mais recentes. Refine os filtros para ver os demais.</div>':''}`;
}

/* =========================================================

const calNum = v => v>=1000 ? (v/1000).toFixed(1).replace('.',',')+'k' : String(Math.round(v));
function calHTML(){
  const ym=VIEW; if(!SELDAY.startsWith(ym)) SELDAY = today().startsWith(ym)?today():ym+'-01';
  const first=new Date(ym+'-01T12:00:00').getDay(), nd=daysIn(ym), T=today(), mt=monthTx(ym);
  let cells=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="blank"></div>';
  for(let d=1;d<=nd;d++){
    const ds=ym+'-'+pad(d), dt=mt.filter(t=>t.date===ds), i=sumV(dt.filter(isIn)), o=sumV(dt.filter(isOut)), late=dt.some(isLate);
    cells+=`<button data-act="selDay" data-d="${ds}" class="${ds===T?'today':''} ${ds===SELDAY?'sel':''}" aria-label="${dBR(ds)}">
      <span class="d">${d}${late?' <span class="c-out">•</span>':''}</span>
      ${i?`<span class="c-in">+${calNum(i)}</span>`:''}${o?`<span class="c-out">−${calNum(o)}</span>`:''}
      ${dt.length>2?`<span class="c-mute hide-sm">${dt.length} itens</span>`:''}</button>`;
  }
  const dt=DB.tx.filter(t=>t.date===SELDAY).sort((a,b)=>a.type.localeCompare(b.type));
  return `<div class="panel first"><div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:var(--in)"></i>entradas</span><span><i style="background:var(--out)"></i>saídas</span><span>• conta vencida</span></div></div>
    <div class="panel" style="margin-top:12px"><h3>${dLabel(SELDAY)} <small>${dBR(SELDAY)}</small>
      <button class="btn sm ghost r" data-act="new" data-type="out" data-date="${SELDAY}">+ Despesa</button><button class="btn sm ghost" data-act="new" data-type="in" data-date="${SELDAY}">+ Entrada</button></h3>
      ${dt.length? dt.map(itemHTML).join('') : '<div class="empty">Nenhum lançamento neste dia.</div>'}
      <div class="rows num" style="margin-top:8px">
        <div><span>Entradas do dia</span><span class="c-in">${brl(sumV(dt.filter(isIn)))}</span></div>
        <div><span>Saídas do dia</span><span class="c-out">${brl(sumV(dt.filter(isOut)))}</span></div>
        <div class="tot"><span>${SELDAY<T?'Saldo ao fim do dia':'Saldo previsto após este dia'}</span><span>${brl(projected(SELDAY))}</span></div>
      </div></div>`;
}

/* =========================================================
   TELA: RELATÓRIOS
   ========================================================= */
function repRange(){
  const {kind,anchor}=REP;
  if(kind==='dia') return [anchor,anchor,dBR(anchor)];
  if(kind==='semana'){ const s=weekStart(anchor); return [s,addDays(s,6),dShort(s)+' a '+dBR(addDays(s,6))]; }
  if(kind==='mes'){ const ym=anchor.slice(0,7); return [ym+'-01',endOf(ym),mLabel(ym)]; }
  const y=anchor.slice(0,4); return [y+'-01-01',y+'-12-31','ano de '+y];
}
function repHTML(){
  const [a,b,label]=repRange(), list=rangeTx(a,b), ins=list.filter(isIn), outs=list.filter(isOut);
  const ganho=sumV(ins), fixa=sumV(ins.filter(t=>t.cat==='Salário')), extra=sumV(ins.filter(t=>t.cat==='Renda extra'));
  const gasto=sumV(outs), byCat=groupSum(outs,'cat'), top=Object.entries(byCat).sort((x,y)=>y[1]-x[1])[0];
  const allG=DB.tx.filter(t=>t.group), futP=sumV(allG.filter(t=>isPend(t)&&t.date>today()));
  const paidAll=sumV(DB.tx.filter(t=>isOut(t)&&isOk(t)&&t.date>=a&&t.date<=b));
  const falta=sumV(DB.tx.filter(t=>isOut(t)&&isPend(t)));
  const nextM=planMonths(2)[1];
  const Q=[
    ['Quanto ganhei?',brl(ganho),`recebido ${brl(sumV(ins.filter(isOk)))} • previsto ${brl(sumV(ins.filter(isPend)))}`,'c-in'],
    ['Quanto ganhei de renda extra?',brl(extra),`${pct(ganho?extra/ganho:0)} das entradas`,'c-in'],
    ['Renda fixa (salário)',brl(fixa),`${pct(ganho?fixa/ganho:0)} das entradas`,''],
    ['Quanto gastei?',brl(gasto),`pago ${brl(sumV(outs.filter(isOk)))} • pendente ${brl(sumV(outs.filter(isPend)))}`,'c-out'],
    ['Onde estou gastando mais?',top?esc(top[0]):'—',top?`${brl(top[1])} • ${pct(top[1]/gasto)} dos gastos`:'sem gastos',''],
    ['Quanto sobrou?',brl(ganho-gasto),'entradas − saídas do período',ganho-gasto<0?'c-out':'c-in'],
    ['Quanto já paguei?',brl(paidAll),'despesas pagas no período',''],
    ['Quanto ainda falta pagar?',brl(falta),'todas as contas e parcelas pendentes','c-warn'],
    ['Parcelas futuras',brl(futP),`${allG.filter(t=>isPend(t)&&t.date>today()).length} parcelas a vencer`,'c-warn'],
    ['Renda comprometida',pct(ganho?gasto/ganho:0),`no período • próximo mês: ${nextM.comp>=9.99?'sem renda prevista':pct(nextM.comp)}`,'']
  ];
  // evolução por sub-período
  let evo='';
  if(REP.kind==='ano'){ const y=a.slice(0,4); const ms=[...Array(12)].map((_,i)=>y+'-'+pad(i+1));
    evo=`<table><tr><th>Mês</th><th class="n">Entradas</th><th class="n">Renda extra</th><th class="n">Saídas</th><th class="n">Sobra</th></tr>${ms.map(m=>{const t=monthTx(m),i=sumV(t.filter(isIn)),o=sumV(t.filter(isOut));return `<tr><td style="text-transform:capitalize">${MESES[+m.slice(5)-1]}</td><td class="n c-in">${brl(i)}</td><td class="n">${brl(sumV(t.filter(isExtra)))}</td><td class="n c-out">${brl(o)}</td><td class="n ${i-o<0?'c-out':''}">${brl(i-o)}</td></tr>`}).join('')}</table>`;
  } else if(REP.kind!=='dia'){ const days=[]; for(let d=a; d<=b; d=addDays(d,1)) days.push(d);
    evo=`<table><tr><th>Dia</th><th class="n">Entradas</th><th class="n">Renda extra</th><th class="n">Saídas</th><th class="n">Saldo do dia</th></tr>${days.map(d=>{const t=list.filter(x=>x.date===d); if(!t.length) return ''; const i=sumV(t.filter(isIn)),o=sumV(t.filter(isOut)); return `<tr><td>${dBR(d)}</td><td class="n c-in">${brl(i)}</td><td class="n">${brl(sumV(t.filter(isExtra)))}</td><td class="n c-out">${brl(o)}</td><td class="n">${brl(i-o)}</td></tr>`}).join('')}</table>`;
  } else evo = list.length? list.map(itemHTML).join('') : '<div class="empty">Nenhum lançamento neste dia.</div>';
  return `<div class="panel first"><div class="bar">
      <div class="seg">${[['dia','Dia'],['semana','Semana'],['mes','Mês'],['ano','Ano']].map(([v,l])=>`<button class="${REP.kind===v?'on':''}" data-act="repKind" data-v="${v}">${l}</button>`).join('')}</div>
      <div class="month"><button data-act="repPrev" aria-label="Anterior">‹</button><span>${label}</span><button data-act="repNext" aria-label="Próximo">›</button></div>
      <button class="btn sm ghost" data-act="repToday">Hoje</button>
      <button class="btn sm ghost" data-act="csvRep">Exportar período (CSV)</button></div></div>
    <div class="grid g4">${Q.map(q=>`<div class="panel kpi"><div class="k">${q[0]}</div><div class="v num ${q[3]}">${q[1]}</div><div class="s">${q[2]}</div></div>`).join('')}</div>
    <div class="grid g3">
      <div class="panel"><h3>Despesas por categoria</h3>${hbars(byCat)}</div>
      <div class="panel"><h3>Despesas por forma de pagamento</h3>${hbars(groupSum(outs,'method'))}</div>
      <div class="panel"><h3>Entradas: fixa x extra x outras</h3>${hbars({'Salário':fixa,'Renda extra':extra,'Outros':round2(ganho-fixa-extra)})}</div>
    </div>
    <div class="panel" style="margin-top:12px"><h3>Detalhamento <small>${label}</small></h3><div class="tw">${evo}</div></div>`;
}

/* =========================================================
   EXPORTAÇÃO
   ========================================================= */
function toCSV(list){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"', n=v=>String(round2(v)).replace('.',',');
  const head=['Data','Tipo','Descrição','Categoria','Valor','Forma','Conta/cartão','Status','Data do pagamento','Valor pago','Parcela','Fixa','Observação'];
  const rows=list.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[dBR(t.date),isIn(t)?'Entrada':'Despesa',t.desc,t.cat,n(t.value),t.method,t.cardId?cardName(t.cardId):t.account||'',stLabel(t),dBR(t.paidDate),t.paidValue!=null?n(t.paidValue):'',t.inst||'',t.recId?'sim':'',t.note||''].map(q).join(';'));
  return '\ufeff'+head.map(q).join(';')+'\r\n'+rows.join('\r\n');
}

const backupName = () => 'meu-caixa-backup-'+today()+'.json';

function applyImport(d){
  if(!d || !Array.isArray(d.tx)) return toast('Arquivo inválido: escolha um backup exportado pelo Meu Caixa');
  if(confirm(`Substituir os dados atuais pelo backup (${d.tx.length} lançamentos)?`)){ DB=normalize(d); save(); VIEW=curYM(); closeModal(); render(); toast('Backup importado'); }
}
const cryptoOK = () => !!(window.crypto && crypto.subtle && window.TextEncoder);
const toB64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const fromB64 = b => Uint8Array.from(atob(b), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptBackup(str, pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,salt),new TextEncoder().encode(str));
  return JSON.stringify({app:'meu-caixa',enc:'AES-256-GCM/PBKDF2',v:1,created:today(),salt:toB64(salt),iv:toB64(iv),data:toB64(new Uint8Array(ct))});
}
async function decryptBackup(d, pass){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(d.iv)},await deriveKey(pass,fromB64(d.salt)),fromB64(d.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
let PENDING_ENC=null;
async function unlockImport(){
  if(!PENDING_ENC) return; if(!cryptoOK()) return toast('Este navegador não consegue abrir backups protegidos. Use o Chrome ou o Edge');
  try{ const d=await decryptBackup(PENDING_ENC, fv('u_pass')); PENDING_ENC=null; applyImport(d); }
  catch(e){ toast('Senha incorreta'); }
}

      <p class="note full">Use um e-mail <b>pessoal</b>, não o do trabalho.</p>
    </div>
    <div class="foot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="sendBackup">Gerar e enviar</button></div>`);
  const l=$('#b_lock'); if(l) l.onchange=()=>{ $('#b_passbox').style.display=l.checked?'':'none'; };
}
async function sendBackup(){
  const email=fv('b_email').trim(), lock=$('#b_lock')&&$('#b_lock').checked;
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('E-mail inválido');
  let content=JSON.stringify(DB);
  if(lock){ const p=fv('b_pass'); if(p.length<6) return toast('Use uma senha com pelo menos 6 caracteres'); if(p!==fv('b_pass2')) return toast('As senhas não conferem');
    try{ content=await encryptBackup(content,p); }catch(e){ return toast('Não foi possível proteger o arquivo neste navegador'); } }
  DB.settings.email=email; save();
  const name=backupName(), subject=`Backup Meu Caixa ${dBR(today())}${lock?' (protegido)':''}`;
  const text=`Backup do Meu Caixa gerado em ${dBR(today())}. Para restaurar: abra o app, vá em Ajustes > Importar backup e escolha este arquivo.`;
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile && navigator.canShare){
    try{ const file=new File([content],name,{type:'application/json'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:subject,text}); markBackup(); closeModal(); return toast('Backup compartilhado. Confira se o e-mail foi enviado'); } }
    catch(e){ if(e && e.name==='AbortError') return toast('Envio cancelado'); }
  }
  download(name,content,'application/json'); markBackup();
  MAILDATA={email,subject,text,name};
  openModal(`<h2>Arquivo baixado ✓</h2>
    <p class="note">O arquivo <b>${esc(name)}</b> está na sua pasta Downloads. Agora abra seu e-mail, crie uma mensagem para você mesmo e <b>anexe esse arquivo</b>.</p>
    <div class="choose">
      <button data-act="mailOpen" data-v="gmail">Gmail<small>abre no navegador</small></button>
      <button data-act="mailOpen" data-v="outlook">Outlook.com / Hotmail<small>abre no navegador</small></button>
      <button data-act="mailOpen" data-v="app">Programa de e-mail<small>Outlook, Mail etc.</small></button>
      <button data-act="close">Já fiz / fechar<small>concluir</small></button>
    </div>`);
}
let MAILDATA=null;
function openMailApp(kind){
  const d=MAILDATA||{email:'',subject:'Backup Meu Caixa',text:''}, enc=encodeURIComponent;
  const url = kind==='gmail' ? `https://mail.google.com/mail/?view=cm&fs=1&to=${enc(d.email)}&su=${enc(d.subject)}&body=${enc(d.text)}`
    : kind==='outlook' ? `https://outlook.live.com/mail/0/deeplink/compose?to=${enc(d.email)}&subject=${enc(d.subject)}&body=${enc(d.text)}`
    : `mailto:${enc(d.email)}?subject=${enc(d.subject)}&body=${enc(d.text)}`;
  window.open(url, kind==='app'?'_self':'_blank');
}

function loadDemo(){
  let s=20260; const rnd=()=>(s=(s*16807)%2147483647)/2147483647, pick=a=>a[Math.floor(rnd()*a.length)];
  const T=today(), c=curYM(), m0=addM(c,-3);
  DB=blank(); DB.demo=true; DB.initial=500;
  const R=(type,desc,cat,value,day,method)=>DB.rec.push({id:uid(),type,desc,cat,value,day,method,account:type==='out'?'Conta corrente':'',start:m0,active:true});
  R('in','Salário (exemplo)','Salário',3200,5,'Transferência');
  R('out','Aluguel','Casa',950,10,'Boleto'); R('out','Internet','Contas',99.9,15,'Débito automático');
  R('out','Energia','Contas',145,18,'Boleto'); R('out','Água','Contas',68,20,'Boleto');
  R('out','Escola','Escola',380,8,'Boleto'); R('out','Streaming','Assinaturas',39.9,12,'Débito');
  DB.cards.push({id:'cardA',name:'Cartão Azul (exemplo)',closeDay:25,dueDay:5,limit:3000},{id:'cardB',name:'Cartão Verde (exemplo)',closeDay:3,dueDay:10,limit:1500});
  for(let i=0;i<15;i++) ensureRecurring(addM(m0,i));
  const add=(type,date,desc,cat,value,method,account)=>DB.tx.push({id:uid(),type,date,desc,cat,value:round2(value),method,account:account||'',status:'pend',note:''});
  const exp=[['Mercado','Alimentação'],['Padaria','Alimentação'],['Lanche','Alimentação'],['Combustível','Transporte'],['Ônibus','Transporte'],['Farmácia','Saúde'],['Cinema','Lazer'],['Material escolar','Escola']];
  for(let d=m0+'-01'; d<=T; d=addDays(d,1)){
    if(rnd()<0.75) add('in',d,pick(['Entregas','Corridas','Venda de doces','Serviço avulso','Freela']),'Renda extra',30+rnd()*90,pick(['Pix','Pix','Dinheiro']));
    if(rnd()<0.6){ const e=pick(exp); add('out',d,e[0],e[1],10+rnd()*120,pick(['Pix','Débito','Dinheiro']),'Conta corrente'); }
  }
  add('in',addDays(T,4),'Freela combinado','Pix',300,'Pix');
  createGroup({desc:'Geladeira',total:2400,n:12,first:addM(c,-2)+'-10',cat:'Casa',method:'Boleto',account:'Conta corrente'});
  createGroup({desc:'Notebook',total:1800,n:10,first:addM(c,-1)+'-22',cat:'Compras',method:'Boleto',account:'Conta corrente'});
  const cb=(card,desc,date,total,n,cat)=>{ const cd=DB.cards.find(x=>x.id===card); createGroup({desc,total,n,first:cardFirstDue(cd,date),cat,method:'Cartão de crédito',cardId:card,account:cd.name,purchaseDate:date}); };
  cb('cardA','Celular',addM(c,-2)+'-14',1200,6,'Compras');
  cb('cardA','Mercado do mês',addM(c,-1)+'-02',420,1,'Alimentação');
  cb('cardB','Tênis',addM(c,-1)+'-20',300,3,'Compras');
  cb('cardB','Presente',c+'-01',150,1,'Compras');
  DB.goals.push({id:uid(),name:'Reserva de emergência',target:5000,saved:1200,deadline:addM(c,12)+'-01',history:[{date:T,value:1200}]},
                {id:uid(),name:'Viagem de férias',target:3000,saved:2550,deadline:'',history:[{date:T,value:2550}]});
  // tudo que venceu até hoje fica pago, exceto a conta de energia deste mês (para mostrar uma conta vencida/pendente)
  DB.tx.forEach(t=>{ if(t.date<=T && !(t.desc==='Energia'&&t.date.startsWith(c))){ t.status='ok'; t.paidDate=t.date; t.paidValue=t.value; } });
  save();
}

/* =========================================================

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act],[data-tab]'); if(!b) return;
  if(b.dataset.tab){ TAB=b.dataset.tab; closeModal(); render(); window.scrollTo(0,0); return; }
  const a=b.dataset.act, id=b.dataset.id, t=id&&DB.tx.find(x=>x.id===id);
  switch(a){
    case 'prevM': VIEW=addM(VIEW,-1); render(); break;
    case 'nextM': VIEW=addM(VIEW,1); render(); break;
    case 'more': openModal(`<h2>Mais</h2><div class="choose">${SCREENS.filter(s=>!['home','in','out','cal'].includes(s[0])).map(s=>`<button data-tab="${s[0]}">${s[2]} ${s[1]}</button>`).join('')}</div><div class="foot"><button class="btn ghost" data-act="close">Fechar</button></div>`); break;
    case 'chooser': chooser(); break;
    case 'goTab': TAB=b.dataset.v; closeModal(); render(); break;
    case 'goAlert': if(b.dataset.v==='backup'){ openBackupMail(); break; }
      TAB={late:'out',soon:'cal',plan:'plan',goals:'goals'}[b.dataset.v]||'home';
      if(b.dataset.v==='late'){ const F=getF('out'); F.status='late'; F.from=''; F.to=''; }
      render(); window.scrollTo(0,0); break;
    case 'qmode': QUICK=b.dataset.v; render(); setTimeout(()=>$('#qv')&&$('#qv').focus(),20); break;
    case 'quickAdd': {
      const v=parseMoney(fv('qv')); if(!(v>0)) return toast('Digite um valor');
      const I=QUICK==='in', T=today();
      DB.tx.push({id:uid(),type:QUICK,date:T,desc:fv('qd').trim()||(I?'Renda extra':'Gasto do dia'),cat:I?'Renda extra':fv('qc'),value:v,method:fv('qm'),account:'',status:'ok',paidDate:T,paidValue:v,note:''});
      save(); render(); toast(I?`Renda extra de ${brl(v)} lançada`:`Despesa de ${brl(v)} lançada`); setTimeout(()=>$('#qv')&&$('#qv').focus(),30); break; }
    case 'new': openTxForm(b.dataset.type,null,{cat:b.dataset.cat,date:b.dataset.date}); break;
    case 'edit': if(t) openTxForm(t.type,t); break;
    case 'saveTx': saveTx(); break;
    case 'toggle': if(t){ toggleTx(t); render(); toast(stLabel(t)); if(b.dataset.back) openGroup(b.dataset.back); } break;
    case 'pay': if(t) openPay(t.id,b.dataset.back); break;
    case 'savePay': savePay(); break;
    case 'del': {
      if(!t) break;
      if(t.group && confirm('Esta é a parcela '+t.inst+' de “'+t.desc+'”.\n\nOK = excluir a compra inteira (todas as parcelas)\nCancelar = escolher outra opção')){
        DB.tx=DB.tx.filter(x=>x.group!==t.group); delete DB.groups[t.group];
      } else if(confirm('Excluir somente este lançamento?')) DB.tx=DB.tx.filter(x=>x.id!==id); else break;
      save(); render(); toast('Excluído'); break; }
    case 'openGroup': if(b.dataset.g) openGroup(b.dataset.g); else closeModal(); break;
    case 'newGroup': openGroupForm(); break;
    case 'saveGroup': saveGroupForm(); break;
    case 'editGroup': { const g=b.dataset.g, cur=groupInfo(g).G.desc, n=prompt('Novo nome da compra:',cur); if(n&&n.trim()){ DB.tx.forEach(x=>{ if(x.group===g) x.desc=n.trim(); }); if(DB.groups[g]) DB.groups[g].desc=n.trim(); save(); render(); openGroup(g); } break; }
    case 'delGroup': if(confirm('Excluir esta compra e todas as parcelas, inclusive as pagas?')){ DB.tx=DB.tx.filter(x=>x.group!==b.dataset.g); delete DB.groups[b.dataset.g]; save(); closeModal(); render(); toast('Compra excluída'); } break;
    case 'instF': INSTF=b.dataset.v; render(); break;
    case 'newCard': openCardForm(); break;
    case 'editCard': openCardForm(DB.cards.find(c=>c.id===id)); break;
    case 'saveCard': saveCard(); break;
    case 'delCard': { const n=DB.tx.filter(x=>x.cardId===id).length;
      if(confirm(n?`Excluir o cartão e as ${n} parcelas/compras lançadas nele?`:'Excluir este cartão?')){ DB.tx=DB.tx.filter(x=>x.cardId!==id); Object.keys(DB.groups).forEach(g=>{ if(DB.groups[g].cardId===id) delete DB.groups[g]; }); DB.cards=DB.cards.filter(c=>c.id!==id); save(); closeModal(); render(); toast('Cartão excluído'); } break; }
    case 'newCardBuy': openCardBuy(id); break;
    case 'saveCardBuy': saveCardBuy(); break;
    case 'payInvoice': { const open=DB.tx.filter(x=>x.cardId===id&&isPend(x)&&x.date.startsWith(VIEW));
      if(confirm(`Marcar a fatura de ${mLabel(VIEW)} (${brl(sumV(open))}) como paga hoje?`)){ open.forEach(x=>{ x.status='ok'; x.paidDate=today(); x.paidValue=x.value; }); save(); render(); toast('Fatura paga'); } break; }
    case 'newRec': openRecForm(b.dataset.type); break;
    case 'editRec': openRecForm(null, DB.rec.find(r=>r.id===id)); break;
    case 'saveRec': saveRec(); break;
    case 'recPause': { const r=DB.rec.find(x=>x.id===id); if(!r) break;
      if(r.active){ r.active=false; removeFuture(r,addM(curYM(),1)); toast('Pausada a partir do próximo mês'); }
      else { r.active=true; if(r.start<curYM()) r.start=curYM(); ensureAll(); toast('Retomada'); }
      save(); render(); break; }
    case 'recCancel': { const r=DB.rec.find(x=>x.id===id); if(r&&confirm(`Cancelar “${r.desc}”? Ela deixa de ser lançada a partir do próximo mês. O histórico continua.`)){ r.active=false; r.ended=true; r.endYM=curYM(); removeFuture(r,addM(curYM(),1)); save(); render(); toast('Conta cancelada'); } break; }
    case 'recDel': { const r=DB.rec.find(x=>x.id===id); if(r&&confirm(`Excluir “${r.desc}”? Lançamentos pendentes deste mês em diante serão removidos. Os já pagos continuam no histórico.`)){ removeFuture(r,curYM()); DB.rec=DB.rec.filter(x=>x.id!==id); save(); render(); toast('Excluída'); } break; }
    case 'toggleProj': DB.settings.projectExtra=b.checked; save(); render(); break;
    case 'newGoal': openGoalForm(); break;
    case 'editGoal': openGoalForm(DB.goals.find(g=>g.id===id)); break;
    case 'saveGoal': saveGoal(); break;
    case 'goalMove': openGoalMove(DB.goals.find(g=>g.id===id)); break;
    case 'saveGoalMove': saveGoalMove(); break;
    case 'delGoal': if(confirm('Excluir esta meta?')){ DB.goals=DB.goals.filter(g=>g.id!==id); save(); render(); } break;
    case 'selDay': SELDAY=b.dataset.d; render(); break;
    case 'repKind': REP.kind=b.dataset.v; render(); break;
    case 'repPrev': case 'repNext': { const k=a==='repPrev'?-1:1, K=REP.kind;
      REP.anchor = K==='dia'?addDays(REP.anchor,k): K==='semana'?addDays(REP.anchor,7*k): K==='mes'?addMDate(REP.anchor,k): addMDate(REP.anchor,12*k); render(); break; }
    case 'repToday': REP.anchor=today(); render(); break;
    case 'csvRep': { const [x,y]=repRange(); download(`meu-caixa-${REP.kind}-${x}.csv`,toCSV(rangeTx(x,y)),'text/csv;charset=utf-8'); toast('CSV exportado'); break; }
    case 'csvAll': download('meu-caixa-lancamentos-'+today()+'.csv',toCSV(DB.tx),'text/csv;charset=utf-8'); toast('CSV exportado'); break;
    case 'csvF': download('meu-caixa-pesquisa-'+today()+'.csv',toCSV(filtered(b.dataset.sc)),'text/csv;charset=utf-8'); toast('CSV exportado'); break;
    case 'clearF': { const sc=b.dataset.sc; delete FILT[sc]; render(); break; }
    case 'close': closeModal(); break;
    case 'saveIni': { const v=parseMoney(fv('ini')); if(isNaN(v)) return toast('Valor inválido'); DB.initial=v; save(); render(); toast('Saldo inicial salvo'); break; }
    case 'saveSettings': { const l=parseMoney(fv('s_low')), d=parseInt(fv('s_days')), p=parseInt(fv('s_pct'));
      DB.settings.lowBalance=isNaN(l)?0:l; DB.settings.alertDays=d>0?d:5; DB.settings.commitPct=p>0?p:70; save(); render(); toast('Alertas salvos'); break; }
    case 'export': download(backupName(),JSON.stringify(DB,null,1),'application/json'); markBackup(); toast('Backup baixado'); break;
    case 'backupMail': openBackupMail(); break;
    case 'sendBackup': sendBackup(); break;
    case 'mailOpen': openMailApp(b.dataset.v); break;
    case 'unlockImport': unlockImport(); break;
    case 'demo': if(!DB.tx.length||confirm('Substituir os dados atuais pelo exemplo fictício?')){ loadDemo(); VIEW=curYM(); TAB='home'; render(); toast('Exemplo carregado'); } break;
    case 'clearDemo': case 'wipe':
      if(confirm(a==='wipe'?'Apagar TODOS os dados? Isso não pode ser desfeito. Exporte um backup antes.':'Apagar os dados de exemplo e começar do zero?')){ DB=blank(); save(); VIEW=curYM(); TAB=a==='wipe'?'cfg':'home'; render(); toast('Dados apagados. Comece pelo saldo inicial em Ajustes.'); } break;
  }
});
document.addEventListener('input', e=>{
  const f=e.target.dataset.f; if(!f) return;
  const sc=e.target.dataset.sc, F=getF(sc); F[f]=e.target.value;
  if(f==='type'){ F.cat=''; F.method=''; render(); return; }
  const r=$('#results'); if(r) r.innerHTML=resultsHTML(sc);
});
document.addEventListener('change', e=>{
  if(e.target.id!=='imp'||!e.target.files[0]) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
      if(d && d.app==='meu-caixa' && d.enc){ PENDING_ENC=d; openModal(`<h2>Backup protegido</h2><p class="note">Este backup foi protegido com senha. Digite a senha usada ao enviá-lo.</p>
        <div class="f"><label class="full">Senha do backup<input type="password" id="u_pass" autocomplete="off"></label></div>
        <div class="foot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="unlockImport">Abrir backup</button></div>`); }
      else applyImport(d); }
    catch(err){ toast('Arquivo inválido: escolha um backup exportado pelo Meu Caixa'); }
    e.target.value=''; };
  rd.readAsText(e.target.files[0]);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&e.target.id==='u_pass'){ e.preventDefault(); unlockImport(); }
  if(e.key==='Enter'&&['qv','qd'].includes(e.target.id)){ e.preventDefault(); document.querySelector('[data-act="quickAdd"]').click(); }
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

render();
